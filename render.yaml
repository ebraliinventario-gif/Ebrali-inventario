# Render service configuration for Ebrali-inventario
# Note: Do NOT put secrets in this file. Add secrets in the Render dashboard.
services:
  - type: web
    name: ebrali-inventario
    env: python
    region: oregon
    branch: main
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT server:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.7"
      - key: FLASK_ENV
        value: "production"
      # IMPORTANTE: Configure estas variáveis no dashboard do Render:
      # - GOOGLE_APPLICATION_CREDENTIALS=/etc/secrets/minha-app-node-sheets-a27f04d71760.json
      # - SPREADSHEET_ID=1cn-9mg-_8QzYtZpCoLpDvglA036m1j70OvQaO3Ebo4M
      # - WORKSHEET_TITLE=Planilha1
